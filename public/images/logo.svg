<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Emblem -->
  <g transform="translate(10, 10)">
    <!-- Water drop / Leaf combined symbol -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#logoGrad)" />
    <!-- Wave and Sun/Sprout icon -->
    <path d="M 16 38 C 22 32, 28 44, 34 38 C 40 32, 46 44, 50 38" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 18 46 C 24 40, 30 50, 36 44 C 42 38, 46 48, 48 45" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="22" r="7" fill="#fef08a" />
  </g>
  <!-- Typography -->
  <g transform="translate(80, 20)">
    <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#0f172a" letter-spacing="-0.5">Elahera Sirisara</text>
    <text x="0" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#059669">ඇලහැර සිරිසර</text>
    <text x="0" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="1.5">DISCOVER • EXPLORE • EXPERIENCE</text>
  </g>
</svg>
